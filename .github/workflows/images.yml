name: Images CI and CD

on:
  pull_request:
  push:
    branches: ['**']
    # Moving composite-action aliases such as v1 do not publish image versions.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [laptop-location-client, laptop-location-server]
    env:
      IMAGE_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Compose and shell scripts
        shell: bash
        run: |
          docker compose -f "images/$IMAGE_PACKAGE/compose.yaml" config --quiet
          while IFS= read -r -d '' script; do sh -n "$script"; done < <(
            find "images/$IMAGE_PACKAGE" -type f -name '*.sh' -print0
          )
          find "images/$IMAGE_PACKAGE/container" "images/$IMAGE_PACKAGE/tests" \
            -type f -name '*.sh' -print0 |
            xargs -0 shellcheck -x -P SCRIPTDIR
      - name: Build and run offline tests
        shell: bash
        run: sh "images/$IMAGE_PACKAGE/tests/run.sh"
      - name: Test server composite action
        if: matrix.package == 'laptop-location-server'
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:mode=1777 \
            -v "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            --entrypoint python3 laptop-location-server:test \
            -m unittest discover -s .github/actions/server-check/tests -v

  publish:
    name: Publish ${{ matrix.package }}
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [laptop-location-client, laptop-location-server]
    env:
      IMAGE_PACKAGE: ${{ matrix.package }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image and select tags
        shell: bash
        run: |
          namespace="${DOCKERHUB_NAMESPACE,,}"
          if [[ ! "$namespace" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo 'Set DOCKERHUB_USERNAME or DOCKERHUB_NAMESPACE to a Docker Hub namespace.' >&2
            exit 1
          fi
          image="docker.io/$namespace/$IMAGE_PACKAGE"
          tags=("$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo 'The Git tag is not a valid Docker tag.' >&2
              exit 1
            fi
            tags+=("$image:$GITHUB_REF_NAME")
          else
            tags+=("$image:latest")
          fi
          build_tags=()
          for tag in "${tags[@]}"; do build_tags+=(--tag "$tag"); done
          docker build --platform linux/amd64 "${build_tags[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "images/$IMAGE_PACKAGE"
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/image-tags"
      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN Actions secrets.' >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push images
        shell: bash
        run: |
          while IFS= read -r tag; do docker push "$tag"; done < "$RUNNER_TEMP/image-tags"
      - name: Log out of Docker Hub
        if: always()
        shell: bash
        run: docker logout docker.io
