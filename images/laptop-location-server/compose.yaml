name: laptop-location-server
services:
  server:
    build: .
    image: laptop-location-server:local
    env_file:
      - ./config/settings.sh
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/run
    volumes:
      # Writable so the completed Python check can retire its own schedule.
      - ./config:/config
      - ./.state/credentials:/credentials:ro
      - ./.state/data:/data
    healthcheck:
      test: [CMD, /app/healthcheck.sh]
      start_period: 15s
      interval: 1m
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
